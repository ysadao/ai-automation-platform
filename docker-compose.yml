services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-pg
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: inkworks
    ports:
      - "55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d inkworks"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - inkworks-pg:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "3108:3108"
    environment:
      PORT: "3108"
      DATABASE_URL: postgresql://app:app@postgres:5432/inkworks
      STATIC_DIR: /app/static
      DEMO_EXPOSE_TOKENS: "true"
      JWT_ACCESS_SECRET: inkworks-demo-access-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  inkworks-pg:
